name: publish-apt-repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Build Debian package
        run: make package-deb VERSION="${GITHUB_REF_NAME#v}"

      - name: Build APT repository
        env:
          GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          DEB_FILE=$(ls -1 dist/deb/dev-env_*_all.deb | tail -n 1)
          if [ -n "${{ secrets.APT_GPG_PRIVATE_KEY }}" ]; then
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -p "$GNUPGHOME"
            chmod 700 "$GNUPGHOME"
            printf '%s' "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --yes --import
          fi
          ./packaging/build-apt-repo.sh "$DEB_FILE" dist/apt stable

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/deb/*.deb --clobber

      - name: Create Pages artifact
        run: |
          tar -C dist/apt -cf - . | gzip -9 > "$RUNNER_TEMP/github-pages.tar.gz"

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages.tar.gz
          retention-days: 1

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
